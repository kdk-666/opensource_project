services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  app:
    build: .
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      NEWSCARD_MODEL: ${NEWSCARD_MODEL:-qwen2.5:3b}
    volumes:
      - ./src:/app/src
      - ./data:/app/data
      - ./prompts:/app/prompts
      - ./config:/app/config

volumes:
  ollama:
