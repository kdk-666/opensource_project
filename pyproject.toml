[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newscard"
version = "0.1.0"
description = "Google News RSS to card-news video pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "feedparser",
    "trafilatura",
    "lxml_html_clean",
    "googlenewsdecoder",
    "ollama",
    "Pillow",
    "pyyaml",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
newscard = "newscard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
